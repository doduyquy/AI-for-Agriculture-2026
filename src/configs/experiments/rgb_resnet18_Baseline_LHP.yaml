# RGB-only experiment using src/models/resnet18_rgb.py.
#
# Kaggle:
# EXTRA_CONFIG=src/configs/experiments/rgb_resnet18_Baseline_LHP.yaml \
# DATA_DIR=/kaggle/input/datasets/lhngphc/datasets-split02/seed42_val20 \
# bash run.sh

INPUT_MODE: "rgb"
DEVICE: "cuda"
MODEL_NAME: "resnet18_rgb"
RGB_PRETRAINED: true
DROPOUT_P: 0.3

BATCH_SIZE: 32
EPOCHS: 20
LR: 0.0001
SPLIT_MANIFEST_PATH: "splits/seed42_val20/split_manifest.csv"
