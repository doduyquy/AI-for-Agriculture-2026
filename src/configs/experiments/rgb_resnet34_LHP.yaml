INPUT_MODE: "rgb"
DEVICE: "cuda"
MODEL_NAME: "resnet34_rgb"
RGB_PRETRAINED: true
DROPOUT_P: 0.3

BATCH_SIZE: 32
EPOCHS: 30
LR: 0.0001

# Optimizer settings
OPTIMIZER: "Adam"
WEIGHT_DECAY: 0.01

# LR Scheduler settings
SCHEDULER: "ReduceLROnPlateau"
STEP_SIZE: 10
GAMMA: 0.1

SPLIT_MANIFEST_PATH: "splits/seed42_val20/split_manifest.csv"