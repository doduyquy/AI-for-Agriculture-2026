INPUT_MODE: "rgb"
DEVICE: "cuda"
MODEL_NAME: "efficientnet_b0_rgb"
RGB_PRETRAINED: true
DROPOUT_P: 0.3

BATCH_SIZE: 32
EPOCHS: 40
UNFREEZE_EPOCH: 5
UNFREEZE_TARGET: "layer4"

# Differential LR
BACKBONE_LR: 0.00001
HEAD_LR: 0.0001

OPTIMIZER: "Adam"
WEIGHT_DECAY: 0.0001

SCHEDULER: "ReduceLROnPlateau"
PATIENCE: 3
FACTOR: 0.5

EARLY_STOPPING_PATIENCE: 20
SAVE_BEST_METRIC: "val_loss"

SPLIT_MANIFEST_PATH: "splits/seed42_val20/split_manifest.csv"
